name: 📅 Générer Récap Mensuel France

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Mode de génération"
        required: false
        default: "full"
        type: choice
        options:
          - full
          - demo
      recap_period:
        description: "Période au format AAAA_MM (ex: 2026_07). Vide = mois précédent."
        required: false
        default: ""

  # 1er de chaque mois à 15h UTC : couvre automatiquement le mois qui vient
  # de se terminer (voir monthly.py::default_period). Nécessite qu'un
  # fichier data/recap_<AAAA>_<MM>.json ait été préparé au préalable —
  # sinon le pipeline retombe sur un récap de démo (aucun échec silencieux
  # d'un vrai mois "oublié").
  schedule:
    - cron: "0 15 1 * *"

concurrency:
  group: generate-monthly
  cancel-in-progress: false

permissions:
  contents: write   # requis pour publier la release "monthly-latest"

jobs:
  generate:
    name: 📅 Pipeline Récap Mensuel → Vidéo longue (16:9)
    runs-on: ubuntu-latest
    timeout-minutes: 40   # vidéo longue, potentiellement 8-20 segments

    steps:

      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🐍 Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 🔧 Dépendances système
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg espeak-ng fonts-dejavu-core

      - name: 📦 Dépendances Python
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: 📅 Générer (mode demo)
        if: ${{ github.event.inputs.mode == 'demo' }}
        run: python3 run_pipeline.py --theme monthly --demo --recap-period "${{ github.event.inputs.recap_period }}"

      - name: 📅 Générer (mode full / cron)
        if: ${{ github.event.inputs.mode != 'demo' }}
        run: python3 run_pipeline.py --theme monthly --recap-period "${{ github.event.inputs.recap_period }}"
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          UNSPLASH_KEY: ${{ secrets.UNSPLASH_KEY }}

      - name: 📤 Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mensuel-${{ github.run_number }}
          path: |
            output/*.mp4
            output/*.json
          retention-days: 14
          if-no-files-found: error

      - name: 🌐 Publier la release "monthly-latest"
        if: ${{ github.event.inputs.mode != 'demo' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          MP4=$(ls output/mensuel_*.mp4 | head -1)
          cp "$MP4" mensuel_latest.mp4
          [ -f output/metadata.json ] && cp output/metadata.json . || echo '{}' > metadata.json
          gh release delete monthly-latest --yes --cleanup-tag 2>/dev/null || true
          gh release create monthly-latest mensuel_latest.mp4 metadata.json \
            --title "📅 Récap Mensuel France du $(date '+%d/%m/%Y')" \
            --notes "Récap complet du mois écoulé en France, généré le $(date '+%d/%m/%Y à %H:%M UTC').

          **Téléchargement direct :** [mensuel_latest.mp4](https://github.com/${{ github.repository }}/releases/download/monthly-latest/mensuel_latest.mp4)"
          echo "✅ https://github.com/${{ github.repository }}/releases/download/monthly-latest/mensuel_latest.mp4"

      - name: 📊 Résumé
        if: always()
        run: |
          echo "## 📅 Récap Mensuel France — Run #${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if ls output/*.mp4 2>/dev/null | grep -q mp4; then
            SIZE=$(du -sh output/*.mp4 2>/dev/null | cut -f1)
            DUR=$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 output/*.mp4 2>/dev/null | head -1)
            echo "| Taille vidéo | $SIZE |" >> $GITHUB_STEP_SUMMARY
            echo "| Durée | ${DUR%.*}s |" >> $GITHUB_STEP_SUMMARY
            echo "🌐 **Téléchargement : [mensuel_latest.mp4](https://github.com/${{ github.repository }}/releases/download/monthly-latest/mensuel_latest.mp4)**" >> $GITHUB_STEP_SUMMARY
          fi
