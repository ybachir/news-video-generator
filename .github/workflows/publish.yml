name: 📤 Publier Journal Vidéo

on:
  workflow_run:
    workflows:
      - "📰 Générer Journal Vidéo"
      - "⚽ Générer Spécial Coupe du Monde"
      - "🇫🇷 Générer Spécial France"
      - "🔎 Générer Zoom Sur (deepdive)"
      - "📅 Générer Récap Hebdo France"
      - "📅 Générer Récap Mensuel France"
    types: [completed]
  # Déclenchement manuel de secours : permet de (re)publier un run de
  # génération précis sans dépendre du délai de propagation du trigger
  # workflow_run (peut prendre plusieurs minutes après l'ajout d'une
  # nouvelle édition à la liste ci-dessus), ou de republier après un échec.
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Run ID du workflow de génération à publier (ex: 31127136622)"
        required: true
      edition:
        description: "Édition publiée"
        required: true
        type: choice
        options:
          - journal
          - worldcup
          - france
          - deepdive
          - weekly
          - monthly

jobs:
  publish:
    name: 📺 Publication YouTube
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Permissions explicites du GITHUB_TOKEN pour ce job. Sans ce bloc, le
    # job hérite des permissions par défaut du repo — qui peuvent se
    # retrouver durcies après un changement de visibilité (privé/public)
    # et faire échouer le téléchargement cross-workflow de l'artifact
    # (actions/download-artifact@v4) avec l'erreur "Resource not
    # accessible by integration". Déclarer explicitement actions: read
    # rend ce job robuste à ce genre de changement de réglage.
    permissions:
      contents: read
      actions: read
    # Ne publie que si le run de génération a réussi (cas workflow_run), et
    # seulement pour les déclenchements automatiques (cron) ou manuels en
    # mode full — pas pour les runs de test/demo. Le déclenchement manuel de
    # secours (workflow_dispatch) passe toujours cette condition : c'est
    # l'utilisateur qui choisit explicitement quoi publier.
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       (github.event.workflow_run.event == 'schedule' || github.event.workflow_run.event == 'workflow_dispatch'))
    env:
      # Secrets exposés comme variables d'environnement au niveau du JOB :
      # c'est la seule façon fiable de les référencer ensuite dans les
      # conditions if: des steps (les secrets ne sont jamais lisibles
      # directement dans un if:, voir doc GitHub Actions).
      YOUTUBE_TOKEN_JSON:  ${{ secrets.YOUTUBE_TOKEN_JSON }}
      YOUTUBE_CLIENT_JSON: ${{ secrets.YOUTUBE_CLIENT_JSON }}
      INSTAGRAM_USER_ID:   ${{ secrets.INSTAGRAM_USER_ID }}
      INSTAGRAM_TOKEN:     ${{ secrets.INSTAGRAM_TOKEN }}
      # En mode workflow_run (cascade auto), on identifie l'édition via le
      # nom du workflow déclencheur. En mode workflow_dispatch (manuel de
      # secours), l'utilisateur la choisit explicitement via l'input.
      WORKFLOW_NAME:       ${{ github.event.workflow_run.name }}
      MANUAL_EDITION:      ${{ github.event.inputs.edition }}
      MANUAL_RUN_ID:       ${{ github.event.inputs.source_run_id }}
      REPO:                ${{ github.repository }}

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🐍 Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 📦 Dépendances Python (publication)
        run: |
          pip install --upgrade pip
          pip install google-api-python-client google-auth-oauthlib google-auth

      - name: ⬇️ Télécharger l'artifact du run de génération
        uses: actions/download-artifact@v4
        with:
          # Mode cascade : run-id du workflow déclencheur. Mode manuel :
          # run-id fourni explicitement par l'utilisateur (input).
          run-id: ${{ github.event.inputs.source_run_id || github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: downloaded
          merge-multiple: true

      - name: 📤 Publier chaque vidéo générée
        run: |
          # Détermine la release GitHub (tag + préfixe des assets) selon
          # l'édition — soit déduite du workflow déclencheur (cascade auto),
          # soit choisie explicitement (déclenchement manuel de secours).
          EDITION_KEY="$MANUAL_EDITION"
          if [ -z "$EDITION_KEY" ]; then
            case "$WORKFLOW_NAME" in
              "📰 Générer Journal Vidéo")             EDITION_KEY="journal" ;;
              "⚽ Générer Spécial Coupe du Monde")     EDITION_KEY="worldcup" ;;
              "🇫🇷 Générer Spécial France")            EDITION_KEY="france" ;;
              "🔎 Générer Zoom Sur (deepdive)")        EDITION_KEY="deepdive" ;;
              "📅 Générer Récap Hebdo France")         EDITION_KEY="weekly" ;;
              "📅 Générer Récap Mensuel France")       EDITION_KEY="monthly" ;;
              *) echo "❌ Workflow déclencheur inconnu : $WORKFLOW_NAME"; exit 1 ;;
            esac
          fi

          case "$EDITION_KEY" in
            journal)
              RELEASE_TAG="latest"; ASSET_PREFIX="journal_latest"; MULTI="false"; SKIP_INSTAGRAM="false" ;;
            worldcup)
              RELEASE_TAG="worldcup-latest"; ASSET_PREFIX="mondial_latest"; MULTI="false"; SKIP_INSTAGRAM="false" ;;
            france)
              RELEASE_TAG="france-latest"; ASSET_PREFIX="france_latest"; MULTI="false"; SKIP_INSTAGRAM="false" ;;
            deepdive)
              RELEASE_TAG="deepdive-latest"; ASSET_PREFIX="sujet"; MULTI="true"; SKIP_INSTAGRAM="false" ;;
            weekly)
              # Vidéo longue au format PAYSAGE (16:9) : incompatible avec
              # Instagram Reels (vertical, courts) — on ne publie QUE sur
              # YouTube pour cette édition, même si INSTAGRAM_TOKEN est défini.
              RELEASE_TAG="weekly-latest"; ASSET_PREFIX="hebdo_latest"; MULTI="false"; SKIP_INSTAGRAM="true" ;;
            monthly)
              # Même raisonnement que le récap hebdo : format paysage,
              # YouTube uniquement.
              RELEASE_TAG="monthly-latest"; ASSET_PREFIX="mensuel_latest"; MULTI="false"; SKIP_INSTAGRAM="true" ;;
            *)
              echo "❌ Édition inconnue : $EDITION_KEY"; exit 1 ;;
          esac

          shopt -s globstar nullglob
          MP4S=(downloaded/**/*.mp4)
          if [ ${#MP4S[@]} -eq 0 ]; then
            echo "❌ Aucun MP4 trouvé dans l'artifact"
            exit 1
          fi
          echo "🎬 ${#MP4S[@]} vidéo(s) à publier depuis « $WORKFLOW_NAME »"

          I=0
          for MP4 in "${MP4S[@]}"; do
            I=$((I+1))
            echo ""
            echo "════════ Vidéo $I/${#MP4S[@]} : $MP4 ════════"

            # URL publique de CETTE vidéo précise dans la release —
            # correspond exactement au nom d'asset publié par le workflow
            # de génération (sujet1.mp4, sujet2.mp4... pour deepdive, un
            # seul asset fixe pour les éditions mono-vidéo).
            if [ "$MULTI" = "true" ]; then
              PUBLIC_URL="https://github.com/${REPO}/releases/download/${RELEASE_TAG}/${ASSET_PREFIX}${I}.mp4"
            else
              PUBLIC_URL="https://github.com/${REPO}/releases/download/${RELEASE_TAG}/${ASSET_PREFIX}.mp4"
            fi

            if [ -n "$YOUTUBE_TOKEN_JSON" ]; then
              python3 publish.py --video "$MP4" --platform youtube || echo "⚠️ Échec YouTube pour $MP4"
            else
              echo "⏭️ YouTube ignoré (YOUTUBE_TOKEN_JSON absent — génère-le via generate_youtube_token.py en local)"
            fi

            if [ -n "$INSTAGRAM_TOKEN" ] && [ "$SKIP_INSTAGRAM" != "true" ]; then
              python3 publish.py --video "$MP4" --platform instagram --public-url "$PUBLIC_URL" || echo "⚠️ Échec Instagram pour $MP4"
            elif [ "$SKIP_INSTAGRAM" = "true" ]; then
              echo "⏭️ Instagram ignoré (format paysage — incompatible avec les Reels)"
            else
              echo "⏭️ Instagram ignoré (INSTAGRAM_TOKEN absent — nécessite un compte Business + app Meta)"
            fi
          done

      - name: 📊 Résumé
        if: always()
        run: |
          echo "## 📤 Publication — Run déclencheur #${{ github.event.workflow_run.run_number }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Déclenché par : ${{ github.event.workflow_run.event }}" >> "$GITHUB_STEP_SUMMARY"
