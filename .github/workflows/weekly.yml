name: 📅 Générer Récap Hebdo France

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Mode de génération"
        required: false
        default: "full"
        type: choice
        options:
          - full
          - demo

  # Samedi 16h (heure française d'été, UTC+2) → 14h UTC. Couvre la
  # semaine écoulée (lundi à samedi), publié en fin d'après-midi le
  # week-end quand l'audience est disponible pour un format long.
  schedule:
    - cron: "0 14 * * 6"

concurrency:
  group: generate-weekly
  cancel-in-progress: false

permissions:
  contents: write   # requis pour publier la release "weekly-latest"

jobs:
  generate:
    name: 📅 Pipeline Récap Hebdo → Vidéo longue (16:9)
    runs-on: ubuntu-latest
    timeout-minutes: 40   # vidéo longue, potentiellement 10-20 segments

    steps:

      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🐍 Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 🔧 Dépendances système
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg espeak-ng fonts-dejavu-core

      - name: 📦 Dépendances Python
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: 📅 Générer (mode demo)
        if: ${{ github.event.inputs.mode == 'demo' }}
        run: python3 run_pipeline.py --theme weekly --demo

      - name: 📅 Générer (mode full / cron)
        if: ${{ github.event.inputs.mode != 'demo' }}
        run: python3 run_pipeline.py --theme weekly
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          UNSPLASH_KEY: ${{ secrets.UNSPLASH_KEY }}

      - name: 📤 Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: hebdo-${{ github.run_number }}
          path: |
            output/*.mp4
            output/*.json
            output/*.log
          retention-days: 14
          if-no-files-found: error

      - name: 🌐 Publier la release "weekly-latest"
        if: ${{ github.event.inputs.mode != 'demo' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          MP4=$(ls output/hebdo_*.mp4 | head -1)
          cp "$MP4" hebdo_latest.mp4
          [ -f output/metadata.json ] && cp output/metadata.json . || echo '{}' > metadata.json
          [ -f output/weekly_debug.log ] && cp output/weekly_debug.log . || echo 'Pas de log de debug' > weekly_debug.log
          gh release delete weekly-latest --yes --cleanup-tag 2>/dev/null || true
          gh release create weekly-latest hebdo_latest.mp4 metadata.json weekly_debug.log \
            --title "📅 Récap Hebdo France du $(date '+%d/%m/%Y')" \
            --notes "Récap complet de la semaine écoulée en France, généré le $(date '+%d/%m/%Y à %H:%M UTC').

          **Téléchargement direct :** [hebdo_latest.mp4](https://github.com/${{ github.repository }}/releases/download/weekly-latest/hebdo_latest.mp4)"
          echo "✅ https://github.com/${{ github.repository }}/releases/download/weekly-latest/hebdo_latest.mp4"

      - name: 📊 Résumé
        if: always()
        run: |
          echo "## 📅 Récap Hebdo France — Run #${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if ls output/*.mp4 2>/dev/null | grep -q mp4; then
            SIZE=$(du -sh output/*.mp4 2>/dev/null | cut -f1)
            DUR=$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 output/*.mp4 2>/dev/null | head -1)
            echo "| Taille vidéo | $SIZE |" >> $GITHUB_STEP_SUMMARY
            echo "| Durée | ${DUR%.*}s |" >> $GITHUB_STEP_SUMMARY
            echo "🌐 **Téléchargement : [hebdo_latest.mp4](https://github.com/${{ github.repository }}/releases/download/weekly-latest/hebdo_latest.mp4)**" >> $GITHUB_STEP_SUMMARY
          fi
